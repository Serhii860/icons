<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />[cite: 1, 2, 3]
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>LinkHub</h1>
    <div class="links">
      <a href="#profile" class="link-item">
        <i class="ti ti-user"></i>[cite: 1]
        <span>Профіль</span>
      </a>
      <a href="mailto:example@mail.com" class="link-item">
        <i class="ti ti-mail"></i>[cite: 2]
        <span>Пошта</span>
      </a>
      <a href="https://instagram.com" target="_blank" class="link-item">
        <i class="ti ti-brand-instagram"></i>[cite: 3]
        <span>Instagram</span>
      </a>
    </div>
  </main>
</body>
</html>
